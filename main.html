<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">



<style>
    #header {
        width: 100vw;
        height: 78px;
        background-color: aqua;
        display: flex;
        align-items: center;
    }

    .fa {
        font-size: 26px;
        padding-left: 20px;
        cursor: pointer;
    }

    #hammenu {
        position: fixed;
        height: 100vh;
        width: 45%;
        background-color: bisque;
        text-align: center;
        align-items: center;
        transform: translateX(-100%);
        transition: 0.7s ease;
    }

    .item {
        padding: 24px;
        background-color: rgb(214, 124, 13);
        border-top: 2px solid aliceblue;
    }
    body{
        margin: 0px;
    }
</style>

<body>
    <div id="header">
        <i class="fa fa-bars" aria-hidden="true" onclick="openham()"id="ttm"></i>

    </div>

    
    <div id="hammenu">
        <div class="item">home</div>
        <div class="item">about</div>
        <div class="item">connect</div>
    </div>
    <script>
        var turn = false;
        function openham() {
            if (turn ===false) {
                document.getElementById("hammenu").style.transform = "translateX(0)";
                document.getElementById("ttm").classList.replace("fa-bars","fa-times")
                turn = true;
            }
            else {
                document.getElementById("hammenu").style.transform = "translateX(-100%)";
                document.getElementById("ttm").classList.replace("fa-times","fa-bars")
                turn = false;
            }

        }
    </script>
</body>

</html>
